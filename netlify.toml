# Netlify configuration for Next.js deployment
# This file tells Netlify how to build and deploy the Auratech website.

[build]
  command = "npx prisma generate && next build"
  publish = ".next"

[build.environment]
  # Node version — Next.js 16 requires Node 18+
  NODE_VERSION = "20"
  # Next.js runtime — Netlify auto-detects this but we set it explicitly
  NEXT_VERSION = "16"

# Next.js plugin — Netlify auto-installs this, but we declare it for clarity.
# This plugin handles server-side rendering, API routes, and middleware.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers — applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively (fonts, images, etc.)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
